name: Hatoriel Windows CI
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: hatori-windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
      - run: cargo test --all-targets
      - run: cargo build --release
      - uses: actions/upload-artifact@v5
        with:
          name: Hatoriel-Windows
          path: |
            target/release/hatori_ai.exe
            Cargo.lock
          if-no-files-found: error
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          & $iscc "/DAppVersion=$version" installer/HATORI.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v5
        with:
          name: Hatoriel-Windows-Installer
          path: dist/*-Setup.exe
          if-no-files-found: error
      - name: Package portable edition
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable,portable/data,portable/models,portable/runtime | Out-Null
          Copy-Item target/release/hatori_ai.exe portable/
          Set-Content portable/portable.flag 'Portable mode'
          Set-Content portable/models/README.txt 'Place GGUF models here.'
          Set-Content portable/runtime/README.txt 'Place compatible llama-server.exe and its DLLs here.'
          Set-Content portable/README.txt 'Extract the entire folder. Close HATORI before moving it. Data is stored locally in data. Models and runtime are not included.'
      - uses: actions/upload-artifact@v5
        with:
          name: Hatoriel-Windows-Portable
          path: portable/
          if-no-files-found: error
