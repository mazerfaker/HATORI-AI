name: Hatoriel Android CI
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: hatoriel-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".\nandroid/native"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - run: cargo test --no-default-features --lib
      - run: cargo test --manifest-path android/native/Cargo.toml --lib
      - name: Build JNI library
        shell: bash
        run: |
          TOOLCHAIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          cargo build --manifest-path android/native/Cargo.toml --target aarch64-linux-android --release
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp android/native/target/aarch64-linux-android/release/libhatoriel_android.so android/app/src/main/jniLibs/arm64-v8a/
      - name: Run Android JVM regression tests and lint
        run: gradle -p android --no-daemon testDebugUnitTest lintDebug
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Hatoriel-Android-QA
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.*
            android/app/build/test-results/
          if-no-files-found: warn
      - name: Assemble debug APK
        run: gradle -p android --no-daemon assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: Hatoriel-Android-ARM64-Debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/src/main/jniLibs/arm64-v8a/libhatoriel_android.so
          if-no-files-found: error
