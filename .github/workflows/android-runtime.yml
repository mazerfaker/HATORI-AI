name: Hatoriel Android Runtime Preview
on:
  push:
    branches: [main]
    paths: ['android/runtime/**', '.github/workflows/android-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
concurrency:
  group: hatoriel-android-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify Node.js 24
        run: node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1); console.log(process.version)"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Provision Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools ndk;27.2.12479018'
      - name: Verify Android NDK and native build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --version
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          test -f "$NDK/build/cmake/android.toolchain.cmake"
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          if ! command -v cmake >/dev/null || ! command -v ninja >/dev/null || ! command -v file >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y cmake ninja-build file
          fi
          cmake --version
          ninja --version
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
      - name: Build ARM64 runtime
        shell: bash
        run: bash android/runtime/build-llama.sh
      - uses: actions/upload-artifact@v5
        with:
          name: Hatoriel-Android-Llama-Runtime-Preview
          path: android/runtime/out/
          if-no-files-found: error
