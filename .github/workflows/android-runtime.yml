name: Hatoriel Android Runtime Preview
on:
  push:
    branches: [main]
    paths: ['android/runtime/**', '.github/workflows/android-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
concurrency:
  group: hatoriel-android-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify Node.js 24
        run: node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1); console.log(process.version)"
      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Build ARM64 runtime
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash android/runtime/build-llama.sh
      - uses: actions/upload-artifact@v5
        with:
          name: Hatoriel-Android-Llama-Runtime-Preview
          path: android/runtime/out/
          if-no-files-found: error
