[package]
name = "hatori_ai"
version = "0.8.1"
edition = "2021"
[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:rusqlite", "dep:tray-icon", "dep:tiny_http", "dep:image", "dep:rfd", "dep:arboard", "dep:zip", "dep:quick-xml"]

[[bin]]
name = "hatori_ai"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
tiny_http = { version = "0.12", optional = true }
getrandom = "0.2"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
sha2 = "0.10"
zeroize = "1"
eframe = { version = "0.29", optional = true }
image = { version = "0.25", default-features = false, features = ["png","jpeg"], optional = true }
zip = { version = "4.6", default-features = false, features = ["deflate"], optional = true }
quick-xml = { version = "0.37.5", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.19", optional = true }
rfd = { version = "0.15", optional = true, default-features = false }
arboard = { version = "3.4", optional = true, features = ["image-data"] }
