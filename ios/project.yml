name: Hatoriel
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.4"
    CURRENT_PROJECT_VERSION: "54"
targets:
  Hatoriel:
    type: application
    platform: iOS
    sources:
      - Hatoriel
      - path: build/llama-LICENSE.txt
        buildPhase: resources
    dependencies:
      - framework: build/HatorielCore.xcframework
        embed: false
      - framework: build/HatorielLocal.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hatoriel.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hatoriel
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_OBJC_BRIDGING_HEADER: Hatoriel/Hatoriel-Bridging-Header.h
        OTHER_LDFLAGS: ["$(inherited)", "-lresolv", "-liconv", "-lc++", "-framework", "Security", "-framework", "SystemConfiguration"]
schemes:
  Hatoriel:
    build:
      targets:
        Hatoriel: all
